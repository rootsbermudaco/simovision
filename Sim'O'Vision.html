<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omega-Style Scan-O-Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1115;
            color: #e2e8f0;
        }
        .timing-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .scan-container {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            background: #1a1d24;
            border: 1px solid #333;
            border-radius: 0.5rem;
            position: relative;
            min-height: 200px;
        }
        .scan-container::-webkit-scrollbar {
            height: 12px;
            width: 12px;
        }
        .scan-container::-webkit-scrollbar-track {
            background: #1a1d24;
        }
        .scan-container::-webkit-scrollbar-thumb {
            background: #cc0000;
            border-radius: 6px;
        }
        #finish-canvas {
            display: block;
            height: 400px;
            width: auto;
            background-color: #000;
        }
        .slit-overlay {
            position: absolute;
            top: 0;
            left: 80%;
            width: 2px;
            height: 100%;
            background-color: rgba(204, 0, 0, 0.8);
            box-shadow: 0 0 8px rgba(204, 0, 0, 1);
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 10;
            cursor: ew-resize;
        }
        /* Thicker invisible grab area for mobile */
        .slit-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: -20px;
            width: 42px;
            height: 100%;
            background: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-4 px-3">

    <!-- Header -->
    <header class="w-full max-w-md mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-extrabold tracking-wider flex items-center gap-2">
                <span class="text-[#cc0000]">Ω</span> SCAN-O-VISION
            </h1>
            <p class="text-gray-400 text-xs mt-1 uppercase tracking-widest">Precision Timing</p>
        </div>
        <div class="bg-gray-800 px-3 py-2 rounded-lg border border-gray-700 shadow-inner text-right">
            <span class="text-[10px] text-gray-400 uppercase block mb-0.5">Status</span>
            <span id="system-status" class="timing-font text-[#00ff00] text-xs font-bold">READY</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md flex flex-col gap-5">
        
        <!-- Video Input & Preview -->
        <section class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex flex-col">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">Select Video</label>
                <input type="file" id="video-upload" accept="video/*" class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-[#cc0000] file:text-white hover:file:bg-red-700 cursor-pointer bg-gray-900 rounded-lg border border-gray-700 p-1">
            </div>
            <p class="text-[10px] text-yellow-500 mb-2 uppercase tracking-wide text-center">Drag red line to set finish line</p>
            <div id="video-container" class="w-full bg-black rounded-lg aspect-video flex items-center justify-center border border-gray-700 overflow-hidden mb-4 relative select-none">
                <video id="source-video" class="w-full h-full object-contain" muted playsinline></video>
                <div id="slit-overlay" class="slit-overlay"></div>
            </div>
            
            <!-- Controls -->
            <div class="grid grid-cols-2 gap-3 mt-auto">
                <button id="btn-scan" class="col-span-2 bg-[#cc0000] hover:bg-red-700 text-white font-bold py-3 rounded-lg transition-colors shadow-[0_0_15px_rgba(204,0,0,0.4)] disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    START SCAN
                </button>
                <button id="btn-pause" class="bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 rounded-lg transition-colors disabled:opacity-50" disabled>
                    Pause
                </button>
                <button id="btn-reset" class="bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 rounded-lg transition-colors disabled:opacity-50" disabled>
                    Reset
                </button>
                <button id="btn-view-finish" class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-colors shadow-[0_0_15px_rgba(37,99,235,0.4)] disabled:opacity-50 disabled:cursor-not-allowed mt-2" disabled>
                    VIEW PHOTO FINISH
                </button>
            </div>
        </section>

        <!-- Live Photo-Finish Preview -->
        <section class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex flex-col">
            <h2 class="text-sm font-semibold mb-3 border-b border-gray-700 pb-2 uppercase tracking-wide flex justify-between items-center">
                <span>Live Scan Output</span>
                <span id="time-display" class="timing-font text-[#cc0000] text-lg font-bold">00:00.000</span>
            </h2>
            
            <div class="scan-container flex-grow flex items-center justify-start w-full relative h-[250px]">
                <canvas id="finish-canvas" class="h-full w-auto"></canvas>
                <div id="placeholder-text" class="absolute inset-0 flex items-center justify-center text-gray-500 text-sm font-medium pointer-events-none text-center px-4">
                    Upload a video and start scan
                </div>
            </div>
        </section>
    </main>

    <!-- Photo Finish Modal -->
    <div id="modal-photo-finish" class="fixed inset-0 bg-[#0f1115] z-50 hidden flex-col">
        <div class="flex justify-between items-center p-4 border-b border-gray-800 bg-gray-900 shrink-0">
            <h2 class="text-lg font-bold text-white flex items-center gap-2"><span class="text-[#cc0000]">Ω</span> PHOTO FINISH</h2>
            <button id="btn-close-finish" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
        </div>
        
        <div class="flex-grow overflow-hidden flex flex-col lg:flex-row gap-4 p-4">
            <!-- Top/Left Half: Interactive Slit Scan (Zoomable) -->
            <div id="interactive-scroll-container" class="relative overflow-auto bg-black border border-gray-700 rounded w-full lg:w-1/2 scan-container shrink-0" style="height: 45vh;">
                <div class="sticky top-2 left-2 z-40 w-max pointer-events-none mb-[-28px]">
                    <span class="text-[10px] uppercase tracking-widest text-gray-300 bg-gray-900/90 border border-gray-600 px-2 py-1 rounded shadow-lg backdrop-blur-sm">Trackpad: Pinch to Zoom</span>
                </div>
                
                <!-- Wrapper that changes size during zoom -->
                <div id="interactive-wrapper" class="relative block cursor-crosshair touch-none origin-top-left" style="min-width: 100%; min-height: 100%;">
                    <canvas id="interactive-canvas" class="block w-full h-full object-fill"></canvas>
                    <div id="dynamic-cursor" class="absolute top-0 w-[2px] h-full bg-[#ff3333] shadow-[0_0_8px_#ff3333] pointer-events-none hidden z-30">
                        <div id="dynamic-tooltip" class="absolute bottom-full left-1/2 -translate-x-1/2 bg-[#cc0000] text-white px-2 py-1 rounded text-xs font-mono mb-1 whitespace-nowrap"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom/Right Half: Slit Verification -->
            <div class="flex flex-col gap-2 flex-grow min-h-0 bg-gray-900 border border-gray-700 rounded-xl p-3 w-full lg:w-1/2">
                <div class="flex justify-between items-end border-b border-gray-700 pb-2">
                    <h3 class="text-sm font-bold text-white uppercase">Slit Verification</h3>
                    <div class="text-right">
                        <span class="text-gray-400 text-[10px] uppercase tracking-widest block">Time of Crossing</span>
                        <span id="verification-time" class="timing-font text-[#00ff00] text-sm font-bold">--:--.---</span>
                    </div>
                </div>
                
                <div class="relative w-full bg-black rounded overflow-hidden flex items-center justify-center border border-gray-800 flex-grow min-h-0">
                    <canvas id="verification-canvas" class="w-full h-full object-contain"></canvas>
                    <div id="verification-line" class="absolute top-0 w-[2px] h-full bg-[#cc0000] shadow-[0_0_8px_#cc0000] -translate-x-1/2 pointer-events-none" style="left: 80%;"></div>
                    <div id="verification-placeholder" class="absolute inset-0 flex items-center justify-center bg-black/80 text-gray-400 text-xs text-center px-4 pointer-events-none">
                        Click anywhere on the scan above to view frame
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoUpload = document.getElementById('video-upload');
        const videoContainer = document.getElementById('video-container');
        const slitOverlay = document.getElementById('slit-overlay');
        const video = document.getElementById('source-video');
        
        const canvas = document.getElementById('finish-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const btnScan = document.getElementById('btn-scan');
        const btnPause = document.getElementById('btn-pause');
        const btnReset = document.getElementById('btn-reset');
        const btnViewFinish = document.getElementById('btn-view-finish');
        
        const statusDisplay = document.getElementById('system-status');
        const timeDisplay = document.getElementById('time-display');
        const placeholderText = document.getElementById('placeholder-text');

        // Modal Elements
        const modalPhotoFinish = document.getElementById('modal-photo-finish');
        const btnCloseFinish = document.getElementById('btn-close-finish');
        
        const interactiveScrollContainer = document.getElementById('interactive-scroll-container');
        const interactiveWrapper = document.getElementById('interactive-wrapper');
        const interactiveCanvas = document.getElementById('interactive-canvas');
        const interactiveCtx = interactiveCanvas.getContext('2d', { willReadFrequently: true });
        
        const dynamicCursor = document.getElementById('dynamic-cursor');
        const dynamicTooltip = document.getElementById('dynamic-tooltip');

        const verificationCanvas = document.getElementById('verification-canvas');
        const verificationCtx = verificationCanvas.getContext('2d', { willReadFrequently: true });
        const verificationTime = document.getElementById('verification-time');
        const verificationPlaceholder = document.getElementById('verification-placeholder');
        const verificationLine = document.getElementById('verification-line');

        // State Variables
        let isScanning = false;
        let animationId = null;
        let currentX = 0;           
        const slitWidth = 2;        
        let slitRatio = 0.8;        // Default position 80% to the right
        const maxCanvasWidth = 6000; 
        let lastTimeTick = 0;       
        let xToTimeMap = [];        

        // Zoom Variables
        let currentZoom = 1;
        let baseVisualWidth = 0;
        let baseVisualHeight = 0;

        // Utilities
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 1000);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
        }

        function updateStatus(msg, colorClass) {
            statusDisplay.textContent = msg;
            statusDisplay.className = `timing-font text-sm font-bold ${colorClass}`;
        }

        // 1. Slit Dragging Logic
        let isDraggingSlit = false;
        
        function updateSlitPosition(clientX) {
            const rect = videoContainer.getBoundingClientRect();
            let x = clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            slitRatio = x / rect.width;
            slitOverlay.style.left = `${slitRatio * 100}%`;
        }

        slitOverlay.addEventListener('mousedown', () => isDraggingSlit = true);
        slitOverlay.addEventListener('touchstart', (e) => {
            isDraggingSlit = true;
            if(e.cancelable) e.preventDefault();
        }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingSlit) return;
            updateSlitPosition(e.clientX);
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDraggingSlit) return;
            updateSlitPosition(e.touches[0].clientX);
        }, { passive: false });

        window.addEventListener('mouseup', () => isDraggingSlit = false);
        window.addEventListener('touchend', () => isDraggingSlit = false);

        // 2. Video Upload Setup
        videoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            video.src = url;
            
            video.onloadedmetadata = () => {
                canvas.height = video.videoHeight;
                canvas.width = maxCanvasWidth; 
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                currentX = 0;
                lastTimeTick = 0;
                xToTimeMap = [];
                placeholderText.style.display = 'block';
                
                btnScan.disabled = false;
                btnPause.disabled = false;
                btnReset.disabled = false;
                btnViewFinish.disabled = true;
                
                updateStatus('VIDEO LOADED', 'text-yellow-400');
                timeDisplay.textContent = formatTime(0);
            };
        });

        // 3. Scan Loop Algorithm
        function scanLoop() {
            if (!isScanning || video.paused || video.ended) {
                if (video.ended) {
                    isScanning = false;
                    updateStatus('SCAN COMPLETE', 'text-blue-400');
                    btnScan.textContent = "START SCAN";
                    btnViewFinish.disabled = false; 
                }
                return;
            }

            // Extract from exact slit position
            const sourceX = video.videoWidth * slitRatio;
            
            ctx.drawImage(video, sourceX, 0, slitWidth, video.videoHeight, currentX, 0, slitWidth, canvas.height);

            for(let i = 0; i < slitWidth; i++) {
                xToTimeMap[Math.floor(currentX + i)] = video.currentTime;
            }

            if (currentX - lastTimeTick >= 60) {
                const markerY = canvas.height - Math.max(30, canvas.height * 0.05);
                
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(currentX, markerY, 2, canvas.height - markerY);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.max(14, canvas.height * 0.02)}px 'JetBrains Mono', monospace`;
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                
                const timeText = video.currentTime.toFixed(2) + 's';
                ctx.strokeText(timeText, currentX + 5, canvas.height - 10);
                ctx.fillText(timeText, currentX + 5, canvas.height - 10);
                
                lastTimeTick = currentX;
            }

            timeDisplay.textContent = formatTime(video.currentTime);
            currentX += slitWidth;

            const container = canvas.parentElement;
            const displayScale = 250 / canvas.height; 
            const currentDisplayX = currentX * displayScale;
            
            if (currentDisplayX > container.clientWidth / 2) {
                container.scrollLeft = currentDisplayX - (container.clientWidth / 2);
            }

            if (currentX >= canvas.width) {
                isScanning = false;
                video.pause();
                updateStatus('CANVAS FULL', 'text-blue-400');
                btnScan.textContent = "START SCAN";
                btnViewFinish.disabled = false;
                return;
            }

            animationId = requestAnimationFrame(scanLoop);
        }

        // Playback Controls
        btnScan.addEventListener('click', () => {
            if (!video.src) return;
            placeholderText.style.display = 'none';
            btnViewFinish.disabled = true;

            if (!isScanning) {
                video.play();
                isScanning = true;
                btnScan.textContent = "SCANNING...";
                btnViewFinish.disabled = false; 
                updateStatus('SCANNING ACTIVE', 'text-[#cc0000] animate-pulse');
                scanLoop();
            }
        });

        btnPause.addEventListener('click', () => {
            if (isScanning) {
                video.pause();
                isScanning = false;
                btnScan.textContent = "RESUME SCAN";
                updateStatus('PAUSED', 'text-yellow-400');
                btnViewFinish.disabled = false;
                if (animationId) cancelAnimationFrame(animationId);
            }
        });

        btnReset.addEventListener('click', () => {
            isScanning = false;
            video.pause();
            video.currentTime = 0;
            currentX = 0;
            lastTimeTick = 0;
            xToTimeMap = [];
            
            if (animationId) cancelAnimationFrame(animationId);
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            btnScan.textContent = "START SCAN";
            timeDisplay.textContent = formatTime(0);
            updateStatus('READY', 'text-[#00ff00]');
            
            canvas.parentElement.scrollLeft = 0;
            btnViewFinish.disabled = true;
        });

        // 4. Modal & Interactive View setup
        btnViewFinish.addEventListener('click', () => {
            const actualWidth = currentX > 0 ? currentX : canvas.width;
            interactiveCanvas.width = actualWidth;
            interactiveCanvas.height = canvas.height;
            
            interactiveCtx.drawImage(canvas, 0, 0, actualWidth, canvas.height, 0, 0, actualWidth, canvas.height);
            
            modalPhotoFinish.classList.remove('hidden');
            modalPhotoFinish.classList.add('flex');
            
            verificationLine.style.left = `${slitRatio * 100}%`;

            // Init zoom sizes
            baseVisualHeight = interactiveScrollContainer.clientHeight;
            baseVisualWidth = baseVisualHeight * (actualWidth / canvas.height);
            currentZoom = 1;
            
            interactiveWrapper.style.width = `${baseVisualWidth}px`;
            interactiveWrapper.style.height = `${baseVisualHeight}px`;
        });

        btnCloseFinish.addEventListener('click', () => {
            modalPhotoFinish.classList.add('hidden');
            modalPhotoFinish.classList.remove('flex');
        });

        // Trackpad Pinch to Zoom
        interactiveScrollContainer.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                
                const zoomSensitivity = 0.01;
                const delta = -e.deltaY * zoomSensitivity;
                let newZoom = currentZoom * (1 + delta);
                
                newZoom = Math.max(1, Math.min(newZoom, 15));
                
                if (newZoom !== currentZoom) {
                    const rect = interactiveScrollContainer.getBoundingClientRect();
                    const mouseContainerX = e.clientX - rect.left;
                    const mouseContainerY = e.clientY - rect.top;
                    
                    const zoomFactor = newZoom / currentZoom;
                    currentZoom = newZoom;
                    
                    interactiveWrapper.style.width = `${baseVisualWidth * currentZoom}px`;
                    interactiveWrapper.style.height = `${baseVisualHeight * currentZoom}px`;
                    
                    interactiveScrollContainer.scrollLeft = (interactiveScrollContainer.scrollLeft + mouseContainerX) * zoomFactor - mouseContainerX;
                    interactiveScrollContainer.scrollTop = (interactiveScrollContainer.scrollTop + mouseContainerY) * zoomFactor - mouseContainerY;
                }
            }
        }, { passive: false });

        // Hover & Click Logic
        function handlePointerMove(e) {
            const rect = interactiveWrapper.getBoundingClientRect();
            let clientX = e.clientX;
            
            if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
            
            let displayX = clientX - rect.left;
            if (displayX < 0) displayX = 0;
            if (displayX > rect.width) displayX = rect.width;

            const scale = interactiveCanvas.width / rect.width;
            const internalX = Math.floor(displayX * scale);

            dynamicCursor.style.display = 'block';
            dynamicCursor.style.left = `${(displayX / rect.width) * 100}%`;
            
            let time = xToTimeMap[internalX];
            
            if (time === undefined) {
                let offset = 1;
                while (time === undefined && offset < 10) {
                    time = xToTimeMap[internalX - offset] || xToTimeMap[internalX + offset];
                    offset++;
                }
            }
            
            const finalTime = time || 0;
            dynamicTooltip.textContent = finalTime.toFixed(3) + 's';
            interactiveWrapper.dataset.hoverTime = finalTime;
        }

        interactiveWrapper.addEventListener('mousemove', handlePointerMove);
        interactiveWrapper.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            handlePointerMove(e);
        }, { passive: false });
        
        interactiveWrapper.addEventListener('mouseleave', () => {
            dynamicCursor.style.display = 'none';
        });

        interactiveWrapper.addEventListener('click', () => {
            const time = parseFloat(interactiveWrapper.dataset.hoverTime);
            if (!isNaN(time)) openVerification(time);
        });

        function openVerification(time) {
            verificationPlaceholder.style.display = 'none';
            verificationTime.textContent = time.toFixed(3) + 's';
            
            const wasPlaying = !video.paused;
            if (wasPlaying) video.pause();
            
            const seekHandler = () => {
                verificationCanvas.width = video.videoWidth;
                verificationCanvas.height = video.videoHeight;
                verificationCtx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
                video.removeEventListener('seeked', seekHandler);
            };
            
            video.addEventListener('seeked', seekHandler);
            video.currentTime = time;
        }

    </script>
</body>
</html>
